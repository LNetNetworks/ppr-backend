services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-ppr_db}
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB:-ppr_db}
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"

volumes:
  mongo_data:
